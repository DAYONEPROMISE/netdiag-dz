name: CI — test + lint + assembleDebug

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Build release APK (unsigned)
        run: ./gradlew :app:assembleRelease --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
      - name: Read app version
        run: |
          VER=$(grep -hoP 'versionName\s*=?\s*[\x27\x22]\K[0-9.]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          CODE=$(grep -hoP 'versionCode\s*=?\s*\K[0-9]+' app/build.gradle app/build.gradle.kts 2>/dev/null | head -1)
          echo "APP_VERSION=${VER:-0.0.0}" >> "$GITHUB_ENV"
          echo "APP_CODE=${CODE:-0}" >> "$GITHUB_ENV"
      - name: Publish release APK to GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: release-v${{ env.APP_VERSION }}-b${{ github.run_number }}
          allowUpdates: false
          name: NetDiagDZ release APK v${{ env.APP_VERSION }} (build ${{ github.run_number }})
          body: Release (unsigned, test only) build of NetDiagDZ v${{ env.APP_VERSION }}+${{ env.APP_CODE }} from commit ${{ github.sha }}. OpenPencil pass: real nav icons with labels replace bullet glyphs. Debug APKs publish under debug-latest and v1.0 tags as before.
          artifacts: "app/build/outputs/apk/release/*.apk"
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'debug-latest' }}
          allowUpdates: true
          replacesArtifacts: true
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Debug build' }}
          body: NetDiagDZ debug APK from CI (tests + lint + assembleDebug).
          artifacts: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish versioned release
        if: github.ref_type != 'tag'
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: Automated versioned APK from main.
          artifacts: app/build/outputs/apk/debug/app-debug.apk
