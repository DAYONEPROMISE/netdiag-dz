name: CI — test + lint + assembleDebug

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        run: |
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMGR" --licenses > /dev/null || true
          "$SDKMGR" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace
      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'debug-latest' }}
          allowUpdates: true
          replacesArtifacts: true
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Debug build' }}
          body: NetDiagDZ debug APK from CI (tests + lint + assembleDebug).
          artifacts: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish versioned release
        if: github.ref_type != 'tag'
        uses: ncipollo/release-action@v1
        with:
          tag: v1.0.${{ github.run_number }}
          name: v1.0.${{ github.run_number }}
          body: Automated versioned APK from main.
          artifacts: app/build/outputs/apk/debug/app-debug.apk
